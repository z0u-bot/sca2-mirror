<title>Equations as images</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one context as a stack of equations (a ? b = y), the query last and set apart; controls above, as chips. */
:root {
  --bg: #f7f8fa;
  --fg: #1d2330;
  --muted: #5d6677;
  --rule: #d5dae3;
  --chip: #e8ebf1;
  --accent: #2d5bd7;
  --accent-fg: #ffffff;
  --frame: #1d2330;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --fg: #e3e7ef; --muted: #98a1b2; --rule: #2c323d; --chip: #222833;
    --accent: #7ea2ff; --accent-fg: #0e1320; --frame: #e3e7ef; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --fg: #e3e7ef; --muted: #98a1b2; --rule: #2c323d; --chip: #222833;
  --accent: #7ea2ff; --accent-fg: #0e1320; --frame: #e3e7ef; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
.controls { display: grid; gap: 8px; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.group > .label { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; min-width: 7.5em; }
.group button {
  font: inherit; font-size: 13px; border: 0; border-radius: 999px; padding: 4px 11px;
  background: var(--chip); color: var(--fg); cursor: pointer;
}
.group.ops button { font-family: var(--font-mono); }
.group button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.group button:disabled { opacity: 0.4; cursor: default; }
.group button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eqs { display: grid; gap: 8px; }
.eq { display: grid; grid-template-columns: 1fr 1.6em 1fr 1.6em 1fr; align-items: center; gap: 4px; }
.eq.compare { grid-template-columns: 1fr 1.6em 1fr 1.6em 1fr 1fr 1fr; column-gap: 8px; }
.eq .sym { text-align: center; font-family: var(--font-mono); font-size: 18px; color: var(--muted); }
.eq figure { margin: 0; display: grid; gap: 3px; }
.eq figcaption { font-size: 12px; color: var(--muted); text-align: center; }
.eq img {
  display: block; width: 100%; max-width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated;
  outline: 1px solid var(--rule); outline-offset: -1px; background: var(--chip);
}
.query { border-top: 1px solid var(--rule); padding-top: 10px; }
.eqs.no-examples .query { border-top: 0; padding-top: 0; }
.query img.answer { outline: 3px solid var(--frame); outline-offset: 0; }
.query img.answer.truth { outline: 1px solid var(--rule); outline-offset: -1px; }
.caption { color: var(--muted); font-size: 13px; max-width: 65ch; margin: 0; }
.caption code { font-family: var(--font-mono); font-size: 12.5px; }
@media (max-width: 480px) { .group > .label { min-width: 100%; } }
</style>

<div class="wrap" id="app">
  <div class="controls">
    <div class="group ops" id="op" role="group" aria-label="Hidden op"><span class="label">Hidden op</span></div>
    <div class="group" id="model" role="group" aria-label="Answer"><span class="label">Answer</span></div>
    <div class="group" id="b" role="group" aria-label="Second image"><span class="label">Second image</span></div>
    <div class="group" id="pick" role="group" aria-label="Model color"><span class="label">Model color</span></div>
    <div class="group" id="render" role="group" aria-label="Colors"><span class="label">Colors</span></div>
    <div class="group" id="walk" role="group" aria-label="Examples"><span class="label">Examples</span></div>
    <div class="group" id="show" role="group" aria-label="Show examples"><span class="label">Show</span></div>
  </div>
  <div class="eqs" id="eqs"></div>
  <p class="caption" id="caption"></p>
</div>

<script>
const BASE = document.documentElement.dataset.panels ?? "panels/";
const OPS = ["mix", "lighten", "darken", "difference", "hue-hsv", "sat-hsv", "value-hsv"];
const EXAMPLES = [["hats", "huelight"], ["barn", "ramp"], ["bikes", "rafting"]];
const CHOICES = {
  op: OPS.map(o => [o, o]),
  model: [["clean", "Unedited model"], ["edited", "Edited model"], ["truth", "True answer"], ["all", "All three"]],
  b: [["ramp", "Gray ramp"], ["huelight", "Hue and lightness"]],
  pick: [["argmax", "Most likely (T = 0)"], ["sample", "Drawn (T = 1)"]],
  render: [["posterized", "Posterized"], ["dithered", "Dithered"]],
  walk: [["in-sync", "In step with the query"], ["random", "Random pixels"]],
  show: [["examples", "Examples and query"], ["query", "Query only"]],
};
const state = { op: "difference", model: "clean", b: "ramp", pick: "argmax", render: "posterized", walk: "in-sync", show: "examples" };

function img(name, alt, cls) {
  const el = document.createElement("img");
  el.src = window.PANELS?.[name] ?? BASE + name + ".png";
  el.alt = alt;
  if (cls) el.className = cls;
  return el;
}
function sym(s) { const el = document.createElement("span"); el.className = "sym"; el.textContent = s; return el; }
function fig(el, caption) {
  const f = document.createElement("figure");
  const c = document.createElement("figcaption");
  c.textContent = caption;
  f.append(el, c);
  return f;
}
function row(cells, extra) {
  const r = document.createElement("div");
  r.className = "eq" + (extra ? " " + extra : "");
  r.append(...cells);
  return r;
}

function answerName(model) {
  const s = state;
  if (model === "truth") return `truth-${s.render}-${s.b}-${s.op}`;
  return `answer-${s.walk}-${s.render}-${s.b}-${s.op}-${model}-${s.pick}`;
}
const NAMES = { clean: "Unedited", edited: "Edited", truth: "True answer" };

function render() {
  const s = state, box = document.getElementById("eqs");
  const rows = [];
  if (s.show === "examples")
    for (const [a, b] of EXAMPLES)
      rows.push(row([img(`operand-${s.render}-${a}`, a), sym("?"), img(`operand-${s.render}-${b}`, b), sym("="),
                     img(`example-${s.render}-${a}-${b}-${s.op}`, `${a} ${s.op} ${b}`)]));
  const qa = img(`operand-${s.render}-parrots`, "parrots"), qb = img(`operand-${s.render}-${s.b}`, s.b);
  if (s.model === "all") {
    const answers = ["clean", "edited", "truth"].map(m =>
      fig(img(answerName(m), NAMES[m], "answer" + (m === "truth" ? " truth" : "")), NAMES[m]));
    rows.push(row([fig(qa, "a"), sym("?"), fig(qb, "b"), sym("="), ...answers], "query compare"));
  } else {
    rows.push(row([qa, sym("?"), qb, sym("="),
      img(answerName(s.model), NAMES[s.model], "answer" + (s.model === "truth" ? " truth" : ""))], "query"));
  }
  box.classList.toggle("no-examples", s.show !== "examples");
  box.replaceChildren(...rows);

  const who = {
    clean: "the unedited model", edited: "the model with the op's axis edited out", truth: "the true op",
    all: "the unedited model, the edited model and the true op",
  }[s.model];
  const pick = s.model === "truth" ? "" : (s.pick === "sample"
    ? ", with one color drawn from the model's answer at each pixel"
    : ", with the model's most likely color at each pixel");
  const walk = s.model === "truth" ? "" : (s.walk === "random"
    ? " Each pixel of the query is its own context, with three example pixels drawn at random from the three example pairs."
    : " Each pixel of the query is its own context, with the three examples taken at the same position in the example pairs.");
  const lead = s.show === "examples" ? `Three examples of <code>${s.op}</code>, then the query` : `The query under <code>${s.op}</code>`;
  document.getElementById("caption").innerHTML = `${lead}, answered by ${who}${pick}.${walk}`;

  for (const k of Object.keys(CHOICES))
    for (const btn of document.querySelectorAll(`#${k} button`)) btn.setAttribute("aria-pressed", String(btn.value === s[k]));
  for (const id of ["pick", "walk"])
    for (const btn of document.querySelectorAll(`#${id} button`)) btn.disabled = s.model === "truth";
}

for (const [k, opts] of Object.entries(CHOICES)) {
  const g = document.getElementById(k);
  for (const [value, label] of opts) {
    const btn = document.createElement("button");
    btn.type = "button"; btn.value = value; btn.textContent = label; btn.id = `${k}-${value}`;
    btn.addEventListener("click", () => { state[k] = value; render(); });
    g.append(btn);
  }
}
render();
</script>
